<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>2026 TOEFL iBT Pro Simulator</title>
    <!-- Tailwind CSS v3 CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- React & Babel CDNs -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Axios -->
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap");
      :root {
        --color-toefl-primary: #005a8d;
        --color-toefl-secondary: #007bbd;
        --color-toefl-background: #f0f4f8;
        --color-toefl-dark: #1e293b;
        --color-toefl-accent: #00b4d8;
      }
      body {
        font-family: "Inter", sans-serif;
        background-color: var(--color-toefl-background);
        color: var(--color-toefl-dark);
        margin: 0;
      }
      .modal-overlay {
        background-color: rgba(30, 41, 59, 0.7);
        backdrop-filter: blur(4px);
      }
      @keyframes progress-slow {
        from { width: 0%; }
        to { width: 66%; }
      }
      .animate-progress-slow {
        animation: progress-slow 60s linear infinite;
      }
    </style>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              toefl: {
                primary: "#005a8d",
                secondary: "#007bbd",
                background: "#f0f4f8",
                dark: "#1e293b",
                accent: "#00b4d8",
              },
            },
          },
        },
      };
    </script>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect, useCallback, useRef } = React;

      /* ── API Service ── */
      const api = axios.create({ baseURL: "http://localhost:8000" });
      const sessionService = {
        startSession: () => api.post("/session/start"),
        getCurrentState: (sid) => api.get(`/session/${sid}/current-state`),
        getNextItem: (sid) => api.get(`/session/${sid}/next-item`),
        submitResponse: (sid, qid, payload) =>
          api.post(`/session/${sid}/submit-response`, {
            question_id: qid,
            text_payload: payload.text_payload || null,
            audio_path: payload.audio_path || null,
          }),
        getScore: (sid) => api.get(`/session/${sid}/score`),
      };

      /* ── Components ── */
      const Icon = ({ name, size = 20, className = "" }) => {
        useEffect(() => {
          lucide.createIcons();
        }, [name, className]);
        return (
          <i
            data-lucide={name}
            style={{ width: size, height: size }}
            className={className}
          ></i>
        );
      };

      const Modal = ({ isOpen, onClose, onConfirm, title, message }) => {
        if (!isOpen) return null;
        return (
          <div className="fixed inset-0 z-50 flex items-center justify-center p-4 modal-overlay animate-in fade-in duration-300">
            <div className="bg-white rounded-2xl shadow-2xl max-w-md w-full p-8 transform animate-in zoom-in duration-300">
              <div className="flex items-center gap-4 text-red-600 mb-4 font-bold text-xl">
                <Icon name="alert-circle" size={28} />
                {title}
              </div>
              <p className="text-gray-600 leading-relaxed mb-8">{message}</p>
              <div className="flex gap-3">
                <button
                  onClick={onClose}
                  className="flex-1 px-6 py-3 bg-gray-100 text-gray-700 font-bold rounded-xl hover:bg-gray-200 transition-colors"
                >
                  Cancel
                </button>
                <button
                  onClick={onConfirm}
                  className="flex-1 px-6 py-3 bg-red-600 text-white font-bold rounded-xl hover:bg-red-700 shadow-lg shadow-red-600/20 transition-all"
                >
                  Yes, Quit
                </button>
              </div>
            </div>
          </div>
        );
      };

        const App = () => {
            const [sessionId, setSessionId] = useState(null);
            const [currentSection, setCurrentSection] = useState(null);
            const [currentItem, setCurrentItem] = useState(null);
            const [loading, setLoading] = useState(false);
            const [isTestStarted, setIsTestStarted] = useState(false);
            const [testResult, setTestResult] = useState(null);
            const [selectedOption, setSelectedOption] = useState(null);
            const [textValue, setTextValue] = useState("");
            const [submitting, setSubmitting] = useState(false);
            const [error, setError] = useState(null);
            const [showExitModal, setShowExitModal] = useState(false);
            const [showAboutModal, setShowAboutModal] = useState(false);

        /* ── Timer Logic ── */
        const [seconds, setSeconds] = useState(1800);
        useEffect(() => {
          if (!isTestStarted || testResult || seconds <= 0) return;
          const timer = setInterval(() => setSeconds((s) => s - 1), 1000);
          return () => clearInterval(timer);
        }, [isTestStarted, testResult, seconds]);

        const formatTime = (s) => {
          const mins = Math.floor(s / 60);
          const secs = s % 60;
          return `${mins.toString().padStart(2, "0")}:${secs.toString().padStart(2, "0")}`;
        };

        const startTest = async () => {
          setError(null);
          try {
            const res = await sessionService.startSession();
            setSessionId(res.data.id);
            setIsTestStarted(true);
            fetchState(res.data.id);
          } catch (err) {
            setError(
              "Failed to start session. Is the FastAPI backend running on port 8000?",
            );
          }
        };

        const fetchState = async (id) => {
          setLoading(true);
          setSelectedOption(null);
          setTextValue("");
          try {
            const stateRes = await sessionService.getCurrentState(id);
            setCurrentSection(stateRes.data);
            const itemRes = await sessionService.getNextItem(id);
            setCurrentItem(itemRes.data);
            // Scroll content area to top
            const container = document.getElementById("question-container");
            if (container) container.scrollTo(0, 0);
          } catch (err) {
            if (err.response?.status === 404) {
              const scoreRes = await sessionService.getScore(id);
              setTestResult(scoreRes.data);
            } else {
              setError("Error fetching test data.");
            }
          } finally {
            setLoading(false);
          }
        };

        const handleSubmit = async (payload) => {
          if (!sessionId || !currentItem || submitting) return;
          setSubmitting(true);
          try {
            await sessionService.submitResponse(
              sessionId,
              currentItem.id,
              payload,
            );
            fetchState(sessionId);
          } catch (err) {
            setError("Submission failed.");
          } finally {
            setSubmitting(false);
          }
        };

        if (!isTestStarted) {
          return (
            <div className="min-h-screen bg-slate-900 flex items-center justify-center p-6 bg-gradient-to-br from-slate-900 via-blue-950 to-slate-900 overflow-auto">
              <div className="max-w-lg w-full">
                <div className="text-center mb-8">
                  <div className="inline-flex items-center justify-center w-20 h-20 rounded-2xl bg-gradient-to-br from-cyan-400 to-blue-600 mb-4 shadow-lg shadow-blue-500/30">
                    <Icon
                      name="shield-check"
                      size={40}
                      className="text-white"
                    />
                  </div>
                  <h1 className="text-5xl font-black text-white tracking-tight">
                    TOEFL iBT
                  </h1>
                  <p className="text-cyan-400 font-bold text-sm tracking-[0.2em] uppercase mt-2">
                    2026 Adaptive Pro
                  </p>
                </div>
                <div className="bg-white/5 backdrop-blur-2xl border border-white/10 rounded-3xl p-8 space-y-6 shadow-2xl relative overflow-hidden">
                  <div className="absolute top-0 right-0 w-32 h-32 bg-blue-500/10 blur-3xl rounded-full -mr-10 -mt-10"></div>
                  <p className="text-gray-300 text-sm text-center leading-relaxed">
                    Experience a high-fidelity multistage adaptive simulation
                    aligned to the latest CEFR-6.0 banding standards.
                  </p>
                  <div className="grid grid-cols-2 gap-3">
                    {["Reading", "Listening", "Writing", "Speaking"].map(
                      (s) => (
                        <div
                          key={s}
                          className="flex flex-col items-center gap-2 bg-white/5 p-4 rounded-xl border border-white/10"
                        >
                          <Icon
                            name={
                              s === "Reading"
                                ? "book-open"
                                : s === "Listening"
                                  ? "headphones"
                                  : s === "Writing"
                                    ? "pen-line"
                                    : "mic"
                            }
                            className="text-cyan-400"
                          />
                          <span className="text-white font-bold text-xs">
                            {s}
                          </span>
                        </div>
                      ),
                    )}
                  </div>
                                {error && <div className="bg-red-500/20 border border-red-500/40 p-4 rounded-xl text-red-200 text-sm flex items-start gap-2"><Icon name="x-circle" size={16} className="mt-0.5 shrink-0" />{error}</div>}
                                <div className="flex gap-4">
                                    <button onClick={() => setShowAboutModal(true)} className="flex-1 flex items-center justify-center gap-2 bg-white/10 text-white font-bold py-4 rounded-2xl border border-white/20 hover:bg-white/20 transition-all">
                                        <Icon name="info" size={20} /> About 2026 Update
                                    </button>
                                    <button onClick={startTest} className="flex-[2] flex items-center justify-center gap-3 bg-gradient-to-r from-cyan-500 to-blue-600 text-white font-black py-4 rounded-2xl shadow-xl hover:shadow-cyan-500/20 hover:scale-[1.02] active:scale-[0.98] transition-all text-xl">
                                        Launch Exam <Icon name="play" size={24} />
                                    </button>
                                </div>
                            </div>
                        </div>

                        {/* ── About TOEFL iBT Modal ── */}
                        {showAboutModal && (
                            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 modal-overlay overflow-y-auto py-12">
                                <div className="bg-white rounded-[40px] shadow-2xl max-w-3xl w-full p-10 transform animate-in zoom-in duration-300 relative my-auto">
                                    <button onClick={() => setShowAboutModal(false)} className="absolute top-8 right-8 text-gray-400 hover:text-black transition-colors">
                                        <Icon name="x" size={32} />
                                    </button>
                                    <h2 className="text-4xl font-black text-[#1e293b] mb-6 tracking-tight">The 2026 Overhaul</h2>
                                    <div className="space-y-6 text-gray-600 leading-relaxed overflow-y-auto max-h-[60vh] pr-4 custom-scrollbar">
                                        <div className="bg-blue-50 p-6 rounded-3xl border border-blue-100">
                                            <p className="font-bold text-blue-900 mb-2">New 1.0–6.0 Band Scale</p>
                                            <p>The old 0–120 score scale has been replaced by a 1.0 to 6.0 band system, aligning directly with CEFR standards.</p>
                                        </div>
                                        <div>
                                            <h3 className="font-black text-[#1e293b] text-xl mb-3">Adaptive Logic</h3>
                                            <p>Reading and Listening sections are now <b>Multi-Stage Adaptive</b>. The test adapts halfway based on your routing stage performance. High accuracy (≥70%) unlocks the Hard Pool and the 6.0 band ceiling.</p>
                                        </div>
                                        <div className="grid grid-cols-2 gap-4">
                                            <div className="p-4 border border-gray-100 rounded-2xl bg-gray-50">
                                                <p className="font-bold text-sm text-black">Reading (27m)</p>
                                                <p className="text-xs">Complete the Words, Read in Daily Life, Academic Passage.</p>
                                            </div>
                                            <div className="p-4 border border-gray-100 rounded-2xl bg-gray-50">
                                                <p className="font-bold text-sm text-black">Listening (27m)</p>
                                                <p className="text-xs">Listen & Response, Campus Conversation, Academic Talk.</p>
                                            </div>
                                            <div className="p-4 border border-gray-100 rounded-2xl bg-gray-50">
                                                <p className="font-bold text-sm text-black">Writing (23m)</p>
                                                <p className="text-xs">Build a Sentence (6m), Email (7m), Discussion (10m).</p>
                                            </div>
                                            <div className="p-4 border border-gray-100 rounded-2xl bg-gray-50">
                                                <p className="font-bold text-sm text-black">Speaking (8m)</p>
                                                <p className="text-xs">Listen and Repeat (7x), Virtual Interview (4 Turns).</p>
                                            </div>
                                        </div>
                                        <p className="text-sm opacity-50 italic">Source: ETS Transition Specifications 2026-2028.</p>
                                    </div>
                                    <div className="mt-10">
                                        <button onClick={() => setShowAboutModal(false)} className="w-full py-4 bg-[#1e293b] text-white rounded-2xl font-bold hover:bg-black transition-all">Understood</button>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                );
            }

        if (testResult) {
          return (
            <div className="min-h-screen bg-slate-900 flex items-center justify-center p-6 bg-gradient-to-br from-slate-900 via-blue-950 to-slate-900">
              <div className="max-w-2xl w-full bg-white border border-gray-100 rounded-3xl p-10 text-center shadow-2xl">
                <Icon
                  name="award"
                  size={64}
                  className="text-amber-500 mx-auto mb-4"
                />
                <h1 className="text-2xl font-bold text-gray-500 uppercase tracking-widest mb-2">
                  Final CEFR Score
                </h1>
                <div className="text-[140px] leading-none font-black text-transparent bg-clip-text bg-gradient-to-r from-[#005a8d] to-[#007bbd] mb-8">
                  {testResult.overall_score?.toFixed(1) || "—"}
                </div>
                <div className="grid grid-cols-2 gap-4 mb-10 text-left">
                  {testResult.sections?.map((s) => (
                    <div
                      key={s.id}
                      className="bg-gray-50 border border-gray-200 rounded-2xl p-6"
                    >
                      <p className="text-[10px] font-black uppercase text-gray-400 tracking-tighter">
                        {s.section_name}
                      </p>
                      <p className="text-4xl font-black text-[#005a8d] mt-1">
                        {s.band_score?.toFixed(1)}
                      </p>
                      <p className="text-[10px] text-gray-400 italic mt-1 capitalize">
                        {s.stage.toLowerCase().replace(/_/g, " ")}
                      </p>
                    </div>
                  ))}
                </div>
                <button
                  onClick={() => window.location.reload()}
                  className="w-full py-4 bg-[#1e293b] text-white rounded-2xl hover:bg-black transition-all font-bold text-lg shadow-xl shrink-0"
                >
                  Return to Dashboard
                </button>
              </div>
            </div>
          );
        }

        const renderQuestionContent = () => {
          if (loading || !currentItem) return null;
          const meta = currentItem.content_meta;
          const taskType = currentItem.task_type;
          const isDualPane = currentSection?.section_name === "Reading" || (currentSection?.section_name === "Listening" && meta.passage);

          const renderLeftPane = () => {
            if (taskType === "COMPLETE_WORDS") {
               return (
                <div className="flex-1 bg-amber-50/50 p-10 rounded-[32px] border border-amber-100/50 shadow-inner overflow-y-auto custom-scrollbar">
                  <p className="font-serif text-3xl leading-relaxed text-gray-800 tracking-wide">
                    {meta.passage}
                  </p>
                </div>
               );
            }
            if (meta.passage) {
               return (
                <div className="flex-1 bg-gray-50 p-10 rounded-[32px] border border-gray-200 shadow-inner overflow-y-auto custom-scrollbar font-serif text-xl leading-relaxed text-gray-700">
                  {meta.passage}
                </div>
               );
            }
            if (meta.transcript) {
               return (
                <div className="flex-1 bg-gradient-to-br from-blue-50 to-indigo-50 p-12 rounded-[40px] border border-blue-100 flex flex-col items-center justify-center text-center shadow-inner relative overflow-hidden">
                  <div className="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] opacity-5"></div>
                  <div className="relative z-10 w-24 h-24 rounded-3xl bg-blue-500 text-white flex items-center justify-center mb-8 shadow-2xl shadow-blue-500/40 animate-pulse">
                    <Icon name="play" size={48} />
                  </div>
                  <div className="relative z-10 space-y-4 max-w-lg">
                    <h4 className="text-blue-900 font-black text-xs uppercase tracking-[0.3em]">Audio Environment</h4>
                    <p className="italic text-2xl text-slate-700 font-medium leading-relaxed">
                      " {meta.transcript} "
                    </p>
                    <div className="pt-8 w-full">
                       <div className="h-1.5 w-full bg-blue-200 rounded-full overflow-hidden">
                          <div className="h-full bg-blue-600 w-2/3 rounded-full animate-progress-slow"></div>
                       </div>
                       <div className="flex justify-between mt-3 text-[10px] font-black text-blue-400 uppercase tracking-widest">
                          <span>01:24</span>
                          <span>-00:46</span>
                       </div>
                    </div>
                  </div>
                </div>
               );
            }
            return null;
          };

          if (isDualPane) {
            return (
              <div className="flex-1 flex flex-col lg:flex-row gap-8 h-full overflow-hidden">
                <div className="flex-1 lg:flex-[1.2] flex flex-col overflow-hidden min-h-0">
                  <div className="font-black text-[10px] uppercase tracking-[0.2em] text-gray-400 mb-4 px-2">Reference Material</div>
                  {renderLeftPane()}
                </div>
                <div className="flex-1 flex flex-col overflow-y-auto px-2 custom-scrollbar">
                  <div className="font-black text-[10px] uppercase tracking-[0.2em] text-[#005a8d] mb-4">Question Interaction</div>
                  <div className="space-y-8 pb-10">
                    <h3 className="text-3xl font-black text-[#1e293b] leading-tight">
                      {meta.question || "Choose the best completion:"}
                    </h3>
                    <div className="space-y-3">
                      {(meta.options || []).map((opt, i) => (
                        <button
                          key={opt}
                          onClick={() => setSelectedOption(opt)}
                          className={`w-full text-left p-6 rounded-3xl border-2 transition-all flex items-center gap-5 group ${selectedOption === opt ? "border-[#005a8d] bg-blue-50 shadow-lg shadow-blue-500/10" : "border-gray-100 bg-white hover:border-gray-300 hover:bg-gray-50"}`}
                        >
                          <span className={`w-12 h-12 rounded-2xl flex items-center justify-center font-black transition-colors ${selectedOption === opt ? "bg-[#005a8d] text-white shadow-lg" : "bg-gray-100 text-gray-400 group-hover:bg-gray-200"}`}>
                            {String.fromCharCode(65 + i)}
                          </span>
                          <span className={`font-bold text-lg ${selectedOption === opt ? "text-[#005a8d]" : "text-gray-600"}`}>
                            {opt}
                          </span>
                        </button>
                      ))}
                    </div>
                  </div>
                </div>
              </div>
            );
          }

          // Refined focus layout for Speaking/Writing
          return (
            <div className="flex-1 flex flex-col max-w-4xl mx-auto w-full h-full min-h-0">
               {taskType === "LISTEN_AND_REPEAT" && (
                  <div className="flex-1 flex flex-col items-center justify-center gap-12">
                    <div className="relative">
                      <div className="absolute inset-0 bg-blue-400 blur-3xl opacity-20 animate-pulse"></div>
                      <div className="w-32 h-32 rounded-[40px] bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center shadow-2xl relative z-10">
                        <Icon name="mic" size={56} className="text-white" />
                      </div>
                    </div>
                    <div className="text-center space-y-4">
                      <h3 className="text-3xl font-black text-[#1e293b] tracking-tight">Listen and Repeat</h3>
                      <p className="text-gray-400 font-bold uppercase text-xs tracking-widest">Acoustic Pacing Evaluation</p>
                    </div>
                    {meta.phrase && (
                      <div className="bg-white p-12 rounded-[40px] border-2 border-dashed border-gray-200 text-4xl font-serif text-center text-gray-300 leading-relaxed shadow-inner">
                        "{meta.phrase}"
                      </div>
                    )}
                    <div className="flex items-center gap-4 bg-red-500/10 px-8 py-3 rounded-full border border-red-500/20 text-red-600 font-black uppercase text-xs tracking-[0.2em] shadow-sm">
                       <span className="w-2.5 h-2.5 bg-red-500 rounded-full animate-ping"></span>
                       Microphone Active
                    </div>
                  </div>
               )}

               {taskType === "TAKE_INTERVIEW" && (
                  <div className="flex-1 flex flex-col gap-8 py-6 h-full overflow-hidden">
                    <div className="bg-gradient-to-br from-slate-900 to-black p-10 rounded-[48px] text-white flex gap-8 items-center shadow-2xl relative overflow-hidden shrink-0">
                       <div className="absolute top-0 right-0 w-64 h-64 bg-cyan-400/5 blur-3xl rounded-full -mr-32 -mt-32"></div>
                       <div className="w-20 h-20 rounded-3xl bg-cyan-400 flex items-center justify-center shrink-0">
                          <Icon name="user-circle" size={40} className="text-black" />
                       </div>
                       <div className="space-y-3 relative z-10">
                          <p className="text-cyan-400 font-black text-[10px] uppercase tracking-[0.3em] opacity-60">AI Examiner</p>
                          <p className="text-2xl font-bold leading-snug">{meta.prompt}</p>
                       </div>
                    </div>
                    <textarea
                      value={textValue}
                      onChange={(e) => setTextValue(e.target.value)}
                      className="flex-1 p-10 bg-white border-2 border-gray-100 rounded-[48px] focus:border-cyan-500 shadow-xl outline-none font-medium text-xl leading-relaxed"
                      placeholder="Respond naturally to the examiner..."
                    />
                  </div>
               )}

               {(taskType === "BUILD_SENTENCE" || taskType === "WRITE_EMAIL" || taskType === "ACADEMIC_DISCUSSION") && (
                  <div className="flex-1 flex flex-col gap-8 py-6 h-full overflow-hidden">
                    <div className="bg-gray-50/50 p-10 rounded-[40px] border border-gray-200/50 shadow-inner shrink-0">
                      <p className="text-2xl font-black text-[#1e293b] leading-tight mb-6">
                        {meta.prompt || meta.context}
                      </p>
                      {meta.scrambled_words && (
                        <div className="flex flex-wrap gap-3">
                          {meta.scrambled_words.map((w, i) => (
                            <div key={i} className="px-6 py-3 bg-white border-2 border-gray-100 rounded-2xl text-lg font-bold text-gray-700 shadow-sm hover:border-[#005a8d] transition-all">
                              {w}
                            </div>
                          ))}
                        </div>
                      )}
                    </div>
                    <textarea
                      value={textValue}
                      onChange={(e) => setTextValue(e.target.value)}
                      className="flex-1 p-10 border-2 border-gray-100 rounded-[40px] focus:border-[#005a8d] shadow-lg outline-none font-medium text-xl leading-relaxed"
                      placeholder="Construct your response here..."
                    />
                  </div>
               )}
            </div>
          );
        };

        return (
          <div className="h-screen flex flex-col bg-[#f0f4f8] overflow-hidden">
            <header className="bg-gradient-to-r from-[#1e293b] to-black text-white p-4 shadow-2xl flex justify-between items-center px-8 z-40 shrink-0">
              <div className="flex items-center gap-6">
                <div className="flex items-center gap-3">
                  <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-400 to-blue-600 flex items-center justify-center">
                    <Icon name="shield-check" size={20} />
                  </div>
                  <div className="hidden md:block">
                    <h1 className="text-sm font-black tracking-[0.1em] uppercase">
                      TOEFL iBT Pro
                    </h1>
                    <div className="flex items-center gap-2 text-[9px] opacity-40 font-bold uppercase tracking-widest">
                      <span className="w-1.5 h-1.5 bg-green-500 rounded-full animate-pulse"></span>
                      Secure Link Active
                    </div>
                  </div>
                </div>
                <div className="h-8 w-px bg-white/10 hidden md:block"></div>
                <div className="text-xs font-bold text-gray-400 uppercase tracking-widest hidden lg:block">
                  Candidate Session:{" "}
                  <span className="text-white ml-1 font-mono tracking-normal">
                    {sessionId?.slice(0, 8)}
                  </span>
                </div>
              </div>
              <div className="flex items-center gap-6">
                <div className="text-right hidden sm:block">
                  <p className="text-[10px] uppercase opacity-40 font-black tracking-widest mb-0.5">
                    Remaining
                  </p>
                  <p
                    className={`text-xl font-mono font-black ${seconds < 120 ? "text-red-500" : "text-white"}`}
                  >
                    {formatTime(seconds)}
                  </p>
                </div>
                <div
                  onClick={() => setShowExitModal(true)}
                  className="group cursor-pointer flex items-center gap-3 px-4 py-2 rounded-xl bg-white/5 border border-white/10 hover:bg-red-500/20 hover:border-red-500/30 transition-all font-bold text-xs"
                >
                  <Icon
                    name="log-out"
                    size={16}
                    className="text-gray-400 group-hover:text-red-500 transition-colors"
                  />
                  Exit
                </div>
              </div>
            </header>

            <div className="h-1.5 bg-gray-200 shrink-0">
              <div
                className="h-full bg-gradient-to-r from-cyan-400 to-[#005a8d] transition-all duration-1000 ease-linear"
                style={{ width: `${(seconds / 1800) * 100}%` }}
              />
            </div>

            <main className="flex-1 overflow-y-auto p-4 md:p-8">
              <div className="max-w-6xl w-full mx-auto flex flex-col min-h-full">
                <div className="flex items-center justify-between mb-8 shrink-0">
                  <div>
                    <h2 className="text-4xl font-black text-[#1e293b] tracking-tight">
                      {currentSection?.section_name}
                    </h2>
                    <p className="text-xs font-bold text-gray-400 uppercase tracking-widest mt-1">
                      {currentSection?.stage.replace(/_/g, " ")}
                    </p>
                  </div>
                </div>

                <div className="bg-white flex-1 rounded-[40px] shadow-2xl border border-gray-100 overflow-hidden flex flex-col mb-8">
                  <div id="question-container" className="flex-1 p-6 md:p-12 overflow-y-auto min-h-[400px]">
                    {renderQuestionContent()}
                  </div>
                  <div className="p-8 px-12 border-t border-gray-100 flex justify-end bg-gray-50/50 shrink-0">
                    <button
                      onClick={() =>
                        handleSubmit({
                          text_payload:
                            currentItem?.task_type === "COMPLETE_WORDS" ||
                            currentItem?.task_type === "BUILD_SENTENCE" ||
                            currentItem?.task_type === "WRITE_EMAIL" ||
                            currentItem?.task_type === "ACADEMIC_DISCUSSION"
                              ? textValue
                              : selectedOption,
                        })
                      }
                      disabled={
                        submitting || (
                            !selectedOption && 
                            !textValue.trim() && 
                            currentItem?.task_type !== "LISTEN_AND_REPEAT"
                        )
                      }
                      className="inline-flex items-center gap-4 bg-[#1e293b] text-white px-10 py-5 rounded-3xl font-black text-xl hover:bg-black hover:scale-[1.05] active:scale-[0.95] disabled:opacity-30 disabled:hover:scale-100 transition-all shadow-xl shadow-slate-900/10"
                    >
                      {submitting ? "Authenticating..." : "Next Task"}
                      <Icon name="chevron-right" size={24} />
                    </button>
                  </div>
                </div>
              </div>
            </main>

            <Modal
              isOpen={showExitModal}
              onClose={() => setShowExitModal(false)}
              onConfirm={() => window.location.reload()}
              title="Quit Simulation?"
              message="Your current progress will be lost. Are you sure you want to terminate this secure test session?"
            />
          </div>
        );
      };

      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<App />);
    </script>
  </body>
</html>
